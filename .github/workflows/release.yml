name: Build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.1 build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v5

      # versionCode is the commit time: monotonic, and the same for any rebuild of a commit
      - name: Compute version
        id: version
        run: |
          echo "code=$(git log -1 --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
          echo "name=0.$(git log -1 --format=%cd --date=format:%y%m%d HEAD).${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Restore signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/suwa-release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/suwa-release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.KEYSTORE_PASSWORD || '' }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew assembleRelease --no-daemon "-PversionCode=$VERSION_CODE" "-PversionName=$VERSION_NAME"

      - name: Prepare release assets
        if: github.event_name != 'pull_request'
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          REPO: ${{ github.repository }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          mkdir -p dist
          tag="v$VERSION_NAME"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          apks="{}"
          for f in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            out="suwa-$VERSION_NAME-$abi.apk"
            cp "$f" "dist/$out"
            sha=$(sha256sum "dist/$out" | cut -d' ' -f1)
            size=$(stat -c %s "dist/$out")
            url="https://github.com/$REPO/releases/download/$tag/$out"
            apks=$(jq --arg abi "$abi" --arg url "$url" --arg sha "$sha" --argjson size "$size" \
              '. + {($abi): {url: $url, sha256: $sha, size: $size}}' <<< "$apks")
          done
          jq -n --argjson code "$VERSION_CODE" --arg name "$VERSION_NAME" --arg notes "$NOTES" --argjson apks "$apks" \
            '{versionCode: $code, versionName: $name, notes: $notes, apks: $apks}' > dist/update.json
          cat dist/update.json

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          gh release create "$TAG" dist/* --title "$TAG" --notes "$NOTES" --latest --target "$GITHUB_SHA"

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/release/*.apk
